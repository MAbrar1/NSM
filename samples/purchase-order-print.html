  .page-ruler { position: absolute; inset: 0; pointer-events: none; }
  .page-ruler .page-break {

  .page-ruler .page-break::before {
    content: ""; position: absolute; left: 0; right: 0; top: -8px; height: 16px;
    pointer-events: auto; cursor: pointer;
  }
  .page-ruler .page-break::after {
    content: attr(data-page);
    position: absolute; right: 8px; top: -9px;
    font-size: 8px; font-weight: 700; letter-spacing: 0.6px;
    color: #2563eb; background: var(--sheet);
    border: 1px solid #2563eb; border-radius: 999px;

  }
  .page-ruler .page-break:hover::after {
    background: #2563eb; color: #fff;
  }
  @media print { .page-ruler { display: none !important; } }

.key==="ArrowRight"&&document.documentElement.dir==="rtl")t=Math.max(1,cur-1);else if(ev.key==="Home"){t=1;ev.preventDefault();}else if(ev.key==="End"){t=pages;ev.preventDefault();}if(t>0){ev.preventDefault();gotoPage(t);}},true);var run=function(){try{var el=document.querySelector(".sheet");if(!el)return;var pages=Math.max(1,Math.ceil(el.scrollHeight/usablePx()));buildRuler(pages);parent.postMessage({type:"najjar-print-page-info",contentHeight:Math.ceil(el.scrollHeight),contentWidth:Math.ceil(el.scrollWidth),pageCount:pages},"*");}catch(e){}};var lastSent=-1;window.addEventListener("scroll",function(){if(document.documentElement.getAttribute("data-preview")!=="1")return;if(lastSent&&Math.abs(window.scrollY-lastSent)<40)return;lastSent=window.scrollY;var el=document.querySelector(".sheet");if(!el)return;var y=window.scrollY-sheetTop();var p=Math.max(1,Math.floor(y/usablePx())+1);parent.postMessage({type:"najjar-print-scroll",page:p},"*");},{passive:true});if(document.readyState!=="loading"){run();}else{document.addEventListener("DOMContentLoaded",run);} window.addEventListener("load",run);})();</script>
