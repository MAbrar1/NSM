name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # CI never touches a real database: integration tests push the
      # Prisma schema into a throwaway SQLite temp file (see
      # tests/integration/env.ts) and ignore this value; DATABASE_URL
      # must exist for Prisma client engine initialization.
      DATABASE_URL: "file:./ci-placeholder.db"
      # Next.js telemetry + build-time env sanity
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Writes the route/page/layout types (`.next/types/`) that next-env.d.ts
      # references. On a fresh clone neither exists yet, so a bare
      # `tsc --noEmit` would fail with TS6053 (missing reference path) before
      # the build step ever gets a chance to generate them. Cheap (no compile)
      # and also lets typecheck validate typed-route definitions.
      - name: Generate Next route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      # Smoke gate: boots `next dev` and fails when it logs a compile or
      # module-resolution error — the stale/half-written `.next` failure
      # mode where the port still answers but every route 500s. `next
      # build` cannot catch it because it rebuilds from scratch.
      - name: Dev-server smoke check
        run: npm run check:dev
        env:
          NEXTAUTH_SECRET: ci-smoke-secret
          NEXTAUTH_URL: http://localhost:3000

      # Design-system gate: compiles globals.css through the real
      # PostCSS + Tailwind v4 pipeline, injects it into the Chrome that
      # ships with the runner, and asserts the computed styles + WCAG
      # ratios. Fails the build on a theme regression.
      - name: Neumorphism design-system audit
        run: npm run audit:neu

      - name: Production build
        run: npm run build

      # A throwaway, seeded SQLite file for the browser gates below. Kept
      # separate from the placeholder DB the unit tests use, so seeding can
      # never leak into (or be mistaken for) the test fixture.
      - name: Prepare browser-test database
        run: |
          npx prisma db push --skip-generate
          npm run db:seed
        env:
          DATABASE_URL: "file:./ci-browser.db"

      # The two gates that need a real browser + a real, seeded server:
      # the migrated-page design-system audit and the empty/error/validation
      # UI verification (which also probes live API field-key responses).
      # `npm run verify:browser` boots `next start` on :3311, runs both, and
      # tears the server down.
      - name: Browser gates (page audit + UI verification)
        run: npm run verify:browser
        env:
          DATABASE_URL: "file:./ci-browser.db"
          AUTH_SECRET: ci-browser-secret
          NEXTAUTH_SECRET: ci-browser-secret
          AUTH_URL: http://localhost:3311
          NEXTAUTH_URL: http://localhost:3311
          CI: "true"

  migrate:
    name: Database migrations (main only)
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Gate: fails (non-zero) when migrations are pending or drifted.
      - name: Check migration status
        run: npm run db:migrate:status
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # Apply pending migrations. `migrate deploy` never resets data and
      # never runs the generator — safe for production by design.
      - name: Apply pending migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      # ─────────────────────────────────────────────────────────────
      # Wire your app deploy here (the migrations have been applied):
      #   - Docker image build + push, then SSH restart, or
      #   - Vercel/Netlify deploy hook, or
      #   - rsync + pm2 restart on a VPS.
      # Keep it AFTER the migrate step so the app never boots against
      # a schema older than its code.
      # ─────────────────────────────────────────────────────────────
